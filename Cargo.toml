[package]
name = "model-harbor"
version = "0.0.9"
edition = "2021"
# 解析图中依赖声明的最高 MSRV：image 0.25.10 / eframe 0.33.3 / egui 0.33.3
rust-version = "1.88"
build = "build.rs"

[[bin]]
name = "ModelHarbor"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
raw-window-handle = "0.6"
serde_yaml_ng = "0.10.0"
# 停在 2.x：3.x 是 breaking 变更（API 与错误类型都改了），当前用法完全够用。
ureq = { version = "2", default-features = true }

# 停在 0.33：0.34 起是 egui 1.0 级重构（SidePanel/TopBottomPanel 被删除、
# App::update 改为 App::ui），迁移需要重写面板挂载与全部 `ui_*` 入口。
# 默认特性已含 glow，不含 wgpu。
eframe = { version = "0.33", features = ["default"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    # 模型延迟探测前的代理/VPN 守卫：读系统代理注册表 + 枚举网卡
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # 用量查询的「今日」区间要本地时区 0 点：GetLocalTime
    "Win32_System_SystemInformation",
]}
rfd = "0.17"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
